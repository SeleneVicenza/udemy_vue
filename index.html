<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primo Esperimento</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h1>Hello World!!</h1>
        <div >{{ message }}</div>
        <button @click="handleChangeStatus">Change status</button>
    </div>
</body>
</html>





<script>
 
  // OPTION API
    /*

                message: 'Ciao Vue!'
            }
        },
        methods: {
            handleChangeStatus() {
                this.message = 'Status changed!'

  // COMPOSITION API
   const { createApp, ref } = Vue
    createApp({
        setup() {
            const message = ref('Ciao Vue!')

            const handleChangeStatus = () => {
                console.log('Clicked!')
                message.value = message.value === 'Ciao Vue!' ? 'Hi Vue !' : 'Ciao Vue!'
            }
            
        
            return {
                message,
                handleChangeStatus
            }
        }
    }).mount('#app')
</script>
