<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primo Esperimento</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <link rel="stylesheet" href=
        "https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>
<body>
    <div id="app">
        <h1>Hello World!!</h1>
        <div>{{ message }} 
            <br> 
            <button @click="handleReset" v-if="edit">Reset</button>
        </div>
            <button @click="handleChangeStatusA">Change status A</button>
            <button @click="handleChangeStatusB">Change status B</button>
        <div>
        <div style="margin-top:20px;">
            <label for="firstName">First Name: </label>
            <!-- Binding in 2 direzioni =>
                v-on:input (@input) event listener, 
                v-bind:value (:value) collega un attributo HTML ai dati reattivi 
                ==> v-model: scorciatoia per -->
            <input type="text" id="firstName" v-model="firstName">
            
        </div>
        <div>
            <label for="lastName">Last Name: </label>
            <input type="text" id="lastName" v-model="lastName">
            
        </div>
        <div>
            <h4 class="text-danger">Full Name: {{ fullName }}</h4>
        </div>
        <div class="d-flex">
            <p class="m-2">Hai più di 18 anni?</p>
            <input type="checkbox" v-model="age">
        </div>
        <div>
            <template v-if="age">
                <p :style="{ color: 'green' }">Sei maggiorenne!</p>
            </template>
            <template v-else>
                <p :style="{ color: 'red' }">Sei minorenne!</p>
            </template>
        </div>
    </div>



    <!-- <script src=
        "https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js">
    </script> -->
</body>
</html>





<script>
   // COMPOSITION API
   const { createApp, ref, watch, computed } = Vue
    createApp({
        setup() {
            const defMessage = 'Ciao Vue!'
            const message = ref(defMessage)
            const edit = ref(false)
            const firstName = ref('');
            const lastName = ref('');
            const age = ref(false);

            const handleChangeStatusA = () => {
                //console.log('Clicked!')
                message.value = "Status changed A!"
            }

            const handleChangeStatusB = () => {
                //console.log('Clicked!')
                message.value = "Status changed B!"
            }

            const handleReset = () => {
                edit.value = false;
                message.value = defMessage;
                
            }

            //monitora lo stato reattivo (es: message)
            watch(message, (message, prevMessage) => {
                console.log(`${prevMessage} => ${message}`)
                if (message !== defMessage) {
                    edit.value = true
                }
            })

            //Proprietà calcolata. Si aggiorna solo se le dipendenze (firstName, lastName) cambiano
            const fullName = computed(() => {
                console.log('Full Name computed property called!')
                return `${firstName.value} ${lastName.value}`;
            })



            return {
                message,
                handleChangeStatusA,
                handleChangeStatusB,
                fullName,
                handleReset,
                edit,
                firstName,
                lastName,
                age
                
            }
        }
    }).mount('#app')
</script>
