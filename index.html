<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primo Esperimento</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h1>Hello World!!</h1>
        <div>{{ message }} 
            <br> 
            <button @click="handleReset" v-if="edit">Reset</button>
        </div>
        <button @click="handleChangeStatusA">Change status A</button>
        <button @click="handleChangeStatusB">Change status B</button>
        <div>
    </div>
</body>
</html>





<script>
   // COMPOSITION API
   const { createApp, ref, watch } = Vue
    createApp({
        setup() {
            const defMessage = 'Ciao Vue!'
            const message = ref(defMessage)
            const edit = ref(false)

            const handleChangeStatusA = () => {
                //console.log('Clicked!')
                message.value = "Status changed A!"
            }

            const handleChangeStatusB = () => {
                //console.log('Clicked!')
                message.value = "Status changed B!"
            }

            const handleReset = () => {
                edit.value = false;
                message.value = defMessage;
                
            }

            //monitora lo stato reattivo (es: message)
            watch(message, (message, prevMessage) => {
                console.log(`${prevMessage} => ${message}`)
                if (message !== defMessage) {
                    edit.value = true
                }
            })

            return {
                message,
                handleChangeStatusA,
                handleChangeStatusB,
                handleReset,
                edit
            }
        }
    }).mount('#app')
</script>
